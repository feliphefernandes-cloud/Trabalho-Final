<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Brachio Run</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lilita+One&family=Inter:wght@400;600&display=swap">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="wrap">
  <header>
    <h1>Brachio Run</h1>
    <p class="sub">Game 2D de plataforma. Desvie dos cactos, pegue as moedas e aguente até o tempo chegar a zero.</p>
  </header>
  <div class="stage">
    <canvas id="game" tabindex="0" aria-label="Jogo Brachio Run: um Brachiosaurus desvia de cactos e coleta moedas"></canvas>
    <button id="btn" type="button">JOGAR</button>
  </div>
  <p class="hint"><kbd>Espaço</kbd> ou <kbd>↑</kbd> para pular. No celular, toque na tela. Você tem 60 segundos.</p>
</div>

<script src="script.js"></script>
</body>
</html>
